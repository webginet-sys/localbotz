<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 366" width="742" height="366" role="img" aria-labelledby="lbTitle lbDesc">
  <title id="lbTitle">LocalBotz</title>
  <desc id="lbDesc">Animated LocalBotz wordmark: localbotz in a pink-to-purple gradient, with a robot face in the letter o that blinks.</desc>
  <defs>
    <linearGradient id="lbGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC2C8A"/>
      <stop offset="35%" stop-color="#D946EF"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .ltr { font-family: "Arial Rounded MT Bold", "Nunito", "Quicksand", "Arial Black", Arial, sans-serif;
           font-weight: 900; font-size: 112px; fill: url(#lbGrad);
           animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    .robot { animation: pop .6s cubic-bezier(.2,.9,.3,1.4) .7s backwards; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s ease-in-out infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93%, 96% { transform: scaleY(.08); } }
    .dot { animation: bounce 3s ease-in-out 1.1s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
  </style>

  <!-- "localb" — letters rise in one by one -->
  <text x="92" y="232" textLength="328" lengthAdjust="spacingAndGlyphs" aria-hidden="true"><tspan class="ltr" style="animation-delay:.05s">l</tspan><tspan class="ltr" style="animation-delay:.13s">o</tspan><tspan class="ltr" style="animation-delay:.21s">c</tspan><tspan class="ltr" style="animation-delay:.29s">a</tspan><tspan class="ltr" style="animation-delay:.37s">l</tspan><tspan class="ltr" style="animation-delay:.45s">b</tspan></text>

  <!-- robot "o": outline + face that blinks -->
  <g class="robot">
    <ellipse cx="482" cy="205" rx="30" ry="29" fill="none" stroke="#8B5CF6" stroke-width="5"/>
    <rect x="465" y="189" width="36" height="26" rx="10" fill="#A855F7"/>
    <g class="eyes" fill="#FDE8F5">
      <ellipse cx="477" cy="201" rx="4.2" ry="2.6"/>
      <ellipse cx="493" cy="201" rx="4.2" ry="2.6"/>
    </g>
  </g>

  <!-- "tz" -->
  <text x="528" y="232" textLength="128" lengthAdjust="spacingAndGlyphs" aria-hidden="true"><tspan class="ltr" style="animation-delay:.55s">t</tspan><tspan class="ltr" style="animation-delay:.63s">z</tspan></text>

  <!-- teal dot above the t -->
  <circle class="dot" cx="560" cy="190" r="10" fill="#0F766E"/>
</svg>
